<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%9E%3C/text%3E%3C/svg%3E" />
  <title>Offline Chess Analyzer</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>♞ Chess Analyzer <span class="badge">offline</span></h1>
      <div id="engine-status" class="engine-status" title="Engine status">engine: loading…</div>
    </header>

    <main class="layout">
      <!-- Left: controls -->
      <aside class="panel controls">
        <section class="card">
          <h2>Game mode</h2>
          <div class="seg" id="mode-seg">
            <button data-mode="ai" class="active">vs AI</button>
            <button data-mode="human">vs Human</button>
          </div>

          <div id="ai-options">
            <label class="field">
              <span>AI strength: <strong id="elo-label">1500 Elo</strong></span>
              <input type="range" id="elo" min="600" max="2850" step="50" value="1500" />
            </label>
            <label class="field">
              <span>You play as</span>
              <select id="ai-side">
                <option value="w" selected>White</option>
                <option value="b">Black</option>
              </select>
            </label>
          </div>
        </section>

        <section class="card">
          <h2>Board</h2>
          <div class="row">
            <button id="new-game" class="btn primary">New game</button>
            <button id="flip" class="btn">Flip board</button>
          </div>
          <div class="row">
            <button id="copy-fen" class="btn">Copy FEN</button>
            <button id="copy-pgn" class="btn">Copy PGN</button>
          </div>
          <div class="row">
            <button id="export-pgn" class="btn">Export PGN</button>
          </div>
          <details class="paste">
            <summary>Import PGN / moves</summary>
            <textarea id="moves-input" rows="3" placeholder="Paste a PGN (with comments/NAGs) or plain moves:&#10;1. d4 g6 2. Bf4 d6 3. Nf3 Bg7 4. c3"></textarea>
            <div id="paste-error" class="paste-error hidden"></div>
            <button id="load-moves" class="btn primary">Import</button>
            <p class="paste-hint">…or drop a <code>.pgn</code> file anywhere on the page.</p>
          </details>
          <label class="toggle">
            <input type="checkbox" id="sound-toggle" checked />
            <span>Sound effects</span>
          </label>
        </section>

        <section class="card">
          <h2>Analysis</h2>
          <label class="toggle">
            <input type="checkbox" id="analysis-toggle" checked />
            <span>Show analysis</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="bestmove-toggle" />
            <span>Show best move</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="threats-toggle" />
            <span>Show threats / hanging</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="annotate-toggle" checked />
            <span>Rate my moves</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="accuracy-toggle" checked />
            <span>Show accuracy</span>
          </label>
          <label class="field">
            <span>Depth: <strong id="depth-label">15</strong></span>
            <input type="range" id="depth" min="6" max="22" step="1" value="15" />
          </label>
        </section>
      </aside>

      <!-- Center: board -->
      <section class="board-wrap">
        <div id="eval-bar" class="eval-bar"><div id="eval-fill" class="eval-fill"></div><span id="eval-num" class="eval-num">0.0</span></div>
        <div id="board" class="board"></div>
        <div id="turn-indicator" class="turn-indicator">White to move</div>
      </section>

      <!-- Right: analysis + moves -->
      <aside class="panel info">
        <section class="card">
          <h2>Opening</h2>
          <div id="opening" class="opening"><span class="opening-name">Starting position</span></div>
          <div class="explorer">
            <input type="text" id="opening-search" class="opening-search" placeholder="Search openings (name or ECO)…" autocomplete="off" />
            <ul id="explorer-list" class="explorer-list"></ul>
          </div>
        </section>
        <section class="card">
          <h2>Best lines</h2>
          <ol id="lines" class="lines"><li class="muted">Analysis hidden / off.</li></ol>
        </section>
        <section class="card grow">
          <h2>Moves</h2>
          <div class="movenav">
            <button id="nav-first" class="navbtn" title="First move (Home)" aria-label="First move">⏮</button>
            <button id="nav-prev" class="navbtn" title="Previous move (←)" aria-label="Previous move">◀</button>
            <button id="nav-next" class="navbtn" title="Next move (→)" aria-label="Next move">▶</button>
            <button id="nav-last" class="navbtn" title="Last move (End)" aria-label="Last move">⏭</button>
            <span class="movenav-hint">← → Home End</span>
          </div>
          <div id="review-summary" class="review-summary hidden"></div>
          <div id="movelist" class="movelist"></div>
        </section>
        <div id="result-banner" class="result-banner hidden"></div>
      </aside>
    </main>
    <div id="drop-overlay" class="drop-overlay hidden"><span>Drop a .pgn file to import</span></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
